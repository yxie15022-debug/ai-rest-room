services:
  rest-room:
    build: .
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      DATABASE_URL: sqlite:////app/data/rest_room.db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://127.0.0.1:8001/mcp}
      API_KEY: ""
    volumes:
      - ./data:/app/data
  caddy:
    image: caddy:2
    depends_on:
      - rest-room
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
