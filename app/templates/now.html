<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>此刻 · {{ app_name }}</title>
  <style>
    :root { --bg: #1b1916; --ink: #f6f1e7; --mute: #c8bfb0; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", Palatino, "Songti SC", serif;
    }
    main { text-align: center; padding: 2rem 1rem 3rem; }
    a { color: inherit; }
    .ticket {
      margin: 0;
      font-family: "Cascadia Mono", Consolas, monospace;
      letter-spacing: 0.16em;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }
    #moment { color: var(--mute); margin: 0.6rem 0 1.2rem; }
    img {
      width: min(92vw, 36rem);
      height: auto;
      image-rendering: pixelated;
      background: #111;
    }
    .quiet { color: var(--mute); }
  </style>
</head>
<body>
  <main>
    {% if view %}
    <p class="ticket"><a id="ticket" href="/r/{{ view.ticket }}">{{ view.ticket }}</a></p>
    <p id="moment">此刻：{{ view.line }}{% if view.still_inside %} · 还在里面{% endif %}</p>
    <img id="shot" src="/scene/{{ view.scene }}.gif" alt="{{ view.line }}" />
    {% else %}
    <p id="empty" class="quiet">还没有人进来。</p>
    {% endif %}
    <p class="quiet"><a href="/">门口</a></p>
  </main>
  <script>
    const shot = document.getElementById('shot');
    const moment = document.getElementById('moment');
    const ticket = document.getElementById('ticket');
    let revision = {{ (view.revision if view else '') | tojson }};
    async function refresh() {
      try {
        const response = await fetch('/now/state');
        if (!response.ok) return;
        const data = await response.json();
        if (!data.ticket) return;
        if (!shot) {
          location.reload();
          return;
        }
        if (data.revision === revision) return;
        revision = data.revision;
        shot.src = '/scene/' + data.scene + '.gif?v=' + encodeURIComponent(data.revision);
        shot.alt = data.line;
        moment.textContent = '此刻：' + data.line + (data.still_inside ? ' · 还在里面' : '');
        ticket.textContent = data.ticket;
        ticket.href = '/r/' + data.ticket;
      } catch (_err) {}
    }
    setInterval(refresh, 2000);
  </script>
</body>
</html>
